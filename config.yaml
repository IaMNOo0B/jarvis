# ============================================================
# JARVIS Configuration
# ============================================================

brain:
  local_model: "hf.co/ge525/Qwen3.8-9B-Distill-uncensored-heretic-Q4_K_M-GGUF:Q4_K_M"
  num_ctx: 8192
  temperature: 0.6
  local_timeout: 120        # seconds before local model is considered failed
  max_tool_rounds: 6        # tool-loop rounds per user request

  # Which brain drives the conversation. Both brains share the SAME toolset,
  # so either one can control this PC, research, and make changes — and each
  # can delegate to the other mid-turn (consult_online_brain /
  # consult_local_brain).
  #   local_first : local Ollama drives, consults Gemini for hard parts
  #   cloud_first : Gemini drives, consults local Ollama for local work
  mode: "local_first"

  cloud:
    # provider: "gemini" (recommended — built-in defaults) or "openai" for any
    # OpenAI-compatible endpoint (Groq: https://api.groq.com/openai/v1,
    # OpenRouter: https://openrouter.ai/api/v1, OpenAI: https://api.openai.com/v1).
    provider: "gemini"
    # Store your key once — no env var needed:
    #     python set_cloud_key.py YOUR_GEMINI_API_KEY
    # (writes secrets.local.yaml, which is excluded from version control).
    # Alternatively set env GEMINI_API_KEY / JARVIS_CLOUD_API_KEY.
    api_key_env: "GEMINI_API_KEY"
    base_url: ""            # empty = provider default (gemini -> Google's OpenAI-compat endpoint)
    model: ""               # empty = provider default (gemini -> gemini-3.8-flash)
    timeout: 60
    consult_budget: 2        # cross-brain consultations allowed per turn
    consult_rounds: 3        # tool rounds a consulted brain may use
    # Backup brains (free, no credit card): tried IN ORDER when the primary
    # cloud brain fails. Keys: comma-separated for rotation, via env or
    # Settings → API Keys. Model auto-detects from each endpoint (free
    # lineups rotate), or set one explicitly.
    fallback:
      - base_url: "https://api.groq.com/openai/v1"
        api_key_env: "GROQ_API_KEY"      # or groq_api_key in Settings
        model: ""
      - base_url: "https://openrouter.ai/api/v1"
        api_key_env: "OPENROUTER_API_KEY"  # or openrouter_api_key in Settings
        model: ""

voice:
  enabled: true
  # --- TTS backend: "piper" (offline, default), "fish", or "elevenlabs" ---
  # piper      = offline British voice, no key, no network (always the fallback)
  # fish       = Fish Audio neural TTS (https://fish.audio) — human, non-robotic
  # elevenlabs = ElevenLabs neural TTS, multilingual model (handles Hinglish)
  # Neural backends fall back to piper automatically if the key/network fails.
  tts_backend: "piper"
  # Fish Audio: API key at https://fish.audio -> API keys. Pick or create a
  # voice, then copy its model ID from the voice page URL.
  fish_voice_id: ""        # reference_id, e.g. "802e3bc2b27e49c2995d23ef70e6ac89"
  fish_model: "s1"         # model header — see Fish Audio docs for newer models
  # ElevenLabs: API key at https://elevenlabs.io/app/settings/api-keys
  elevenlabs_voice_id: ""  # voice ID from your ElevenLabs voice library
  elevenlabs_model: "eleven_multilingual_v2"  # multilingual incl. Hindi
  # API keys: set FISH_API_KEY / ELEVENLABS_API_KEY in the environment, or add
  # fish_api_key: / elevenlabs_api_key: to secrets.local.yaml (same file as
  # the Gemini key — never committed).
  tts_voice: "en_GB-northern_english_male-medium"  # piper voice (offline)
  piper_dir: "models/piper"          # relative to AI_Model/
  stt_model: "base"                  # multilingual; tiny/base/small (no .en = understands Hinglish)
  stt_language: "auto"               # auto-detect per utterance; "en" pins English, "hi" pins Hindi
  # stt_initial_prompt: ""           # override the built-in Hinglish bias prompt (empty = no prompt)
  wake_enabled: true
  wake_word: "hey_jarvis"          # -> local brain
  wake_word_cloud: "hello_jarvis"  # -> cloud brain for the turn (needs a trained openWakeWord model; skipped gracefully until present)
  wake_threshold: 0.5
  barge_in_threshold: 0.7            # wake score needed to interrupt JARVIS speaking
  silence_seconds: 1.2               # trailing silence that ends an utterance
  speech_start_seconds: 0.35         # minimum speech before we start listening for the end
  max_utterance_seconds: 30
  listen_timeout_seconds: 10         # give up if no speech starts after wake word

# Phone link (Phase 5) — control JARVIS from Telegram.
#   1. @BotFather on Telegram -> /newbot -> token into Settings > API Keys
#      ("Telegram bot token"), or TELEGRAM_BOT_TOKEN env var.
#   2. allowed_user_ids: your numeric Telegram ID (@userinfobot). Only these
#      get answers; everyone else is ignored.
telegram:
  enabled: false
  allowed_user_ids: []               # e.g. [123456789]
  poll_timeout_seconds: 50

# Watching eyes (Phase 6) — proactive screen awareness. OFF by default.
# When enabled, a background thread captures the screen (in RAM only, never
# saved to disk) every interval and asks the cloud brain whether you look
# stuck; rarely, he speaks up. Needs the cloud brain (Gemini key).
screen_watcher:
  enabled: false
  interval_seconds: 60
  cooldown_seconds: 600
  stuck_threshold: 7                  # 0-10, how stuck before he considers speaking
  speak_probability: 0.35             # even then, only sometimes — stays rare

hud:
  enabled: true
  width: 470
  height: 680
  corner: "bottom-right"             # bottom-right | bottom-left | top-right | top-left
  click_through: true                # start with mouse pass-through enabled
  update_hz: 60
  show_taskbar: false

routines:
  startup_greeting: true
  create_desktop_icon: true          # Windows: ensure a JARVIS desktop shortcut exists
  morning_briefing: "09:00"          # "" disables
  evening_briefing: "20:00"          # "" disables
  briefing_on_start: false           # speak a briefing immediately at launch
  weather_location: ""               # empty = auto (wttr.in by IP)

presence:
  enabled: true
  away_minutes: 5
  greet_on_return: true
  auto_lock_on_away: false           # WARNING: locks the session after away_minutes
  camera_index: 0
  detect_interval_seconds: 2.0

safety:
  confirm_destructive: true          # ask "are you sure" before shutdown/restart/lock/logoff
  workspace_only_writes: true        # file write tool confined to project folder

text_mode:
  auto_research: true                # legacy text-mode behaviour: auto web research
