"on":
  push:
    paths:
      - "brain.py.part1"
      - "brain.py.part2"
  workflow_dispatch:

permissions:
  contents: write

name: Assemble brain.py

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts into brain.py and remove scaffolding
        run: |
          if [ ! -f brain.py.part1 ] || [ ! -f brain.py.part2 ]; then
            echo "Waiting for both parts - nothing to do."
            exit 0
          fi
          cat brain.py.part1 brain.py.part2 > brain.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain.py
          git rm -q brain.py.part1 brain.py.part2 .github/workflows/assemble-brain.yml
          git commit -m "Assemble brain.py from parts (single-commit size workaround)"
          git push
